name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Tune Gradle and Kotlin memory for CI runner (16GB RAM)
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6144M -XX:+UseParallelGC/' gradle.properties
          sed -i 's/kotlin.daemon.jvm.options=.*/kotlin.daemon.jvm.options=-Xmx6144M/' gradle.properties
          sed -i 's/org.gradle.workers.max=.*/org.gradle.workers.max=4/' gradle.properties
          if grep -q "kotlin.daemon.jvmargs" gradle.properties; then
            sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx6144M/' gradle.properties
          else
            echo "kotlin.daemon.jvmargs=-Xmx6144M" >> gradle.properties
          fi
          cat gradle.properties

      - name: Build Release APKs
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew :app:assembleArm64FossRelease --no-configuration-cache --console=plain
          ./gradlew :app:assembleUniversalFossRelease --no-configuration-cache --console=plain

      - name: Prepare Release Assets
        run: |
          mkdir -p release-apks
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          cp app/build/outputs/apk/arm64Foss/release/*-release.apk release-apks/oto-${TAG}-arm64-v8a.apk
          cp app/build/outputs/apk/universalFoss/release/*-release.apk release-apks/oto-${TAG}-universal.apk
          if [ -f fastlane/metadata/android/en-US/changelogs/default.txt ]; then
            cp fastlane/metadata/android/en-US/changelogs/default.txt release-apks/release_notes.md
          fi
          cat << 'EOF' > release-apks/changelog.json
          {
            "description": "Oto Music release",
            "changelog": [
              {
                "title": "Features & Improvements",
                "items": [
                  "Local .lrc File Picker: pick custom .lrc files from storage directly in the Switch Lyrics sheet.",
                  "Clean Modules Screen: removed Mochy mascot banner and third-party promo.",
                  "Replaced all leftover Mochy mentions in Apple Music module and bridge.",
                  "Purged legacy mascot and promo drawables.",
                  "Aligned provider User-Agent headers and translation strings with Oto."
                ]
              }
            ]
          }
          EOF
          ls -la release-apks/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" release-apks/*.apk release-apks/changelog.json --clobber
          else
            echo "Creating release $TAG..."
            if [ -f release-apks/release_notes.md ]; then
              gh release create "$TAG" release-apks/*.apk release-apks/changelog.json \
                --title "Oto $TAG" \
                --notes-file release-apks/release_notes.md
            else
              gh release create "$TAG" release-apks/*.apk release-apks/changelog.json \
                --title "Oto $TAG" \
                --generate-notes
            fi
          fi
