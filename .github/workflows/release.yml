name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Tune Gradle and Kotlin memory for CI runner (16GB RAM)
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6144M -XX:+UseParallelGC/' gradle.properties
          sed -i 's/kotlin.daemon.jvm.options=.*/kotlin.daemon.jvm.options=-Xmx6144M/' gradle.properties
          sed -i 's/org.gradle.workers.max=.*/org.gradle.workers.max=4/' gradle.properties
          if grep -q "kotlin.daemon.jvmargs" gradle.properties; then
            sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx6144M/' gradle.properties
          else
            echo "kotlin.daemon.jvmargs=-Xmx6144M" >> gradle.properties
          fi
          cat gradle.properties

      - name: Generate Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Oto Android,O=Oto,C=US"

      - name: Build Release APKs
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew :app:assembleArm64FossRelease --no-configuration-cache --console=plain
          ./gradlew :app:assembleUniversalFossRelease --no-configuration-cache --console=plain

      - name: Prepare APKs
        run: |
          mkdir -p release-apks
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          cp app/build/outputs/apk/arm64Foss/release/*-release.apk release-apks/oto-${TAG}-arm64-v8a.apk
          cp app/build/outputs/apk/universalFoss/release/*-release.apk release-apks/oto-${TAG}-universal.apk
          ls -la release-apks/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" release-apks/*.apk --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-apks/*.apk \
              --title "Oto $TAG" \
              --generate-notes
          fi
